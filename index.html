<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Rewards</title>
<link
    rel="stylesheet"
    href="css/style.css"
  >
</head>
  

<body>

  <!-- =========================
       APP
  ========================= -->

  <div id="app">

    <!-- Header -->

    <header>

      <div class="brand">
        Family Rewards
      </div>

      <div class="account">

        <div class="user-info">

          <div class="user-name">
            Alex
          </div>

          <div class="points">
            <strong id="points">
              2,450
            </strong>
            points
          </div>

        </div>

        <div class="avatar">
          A
        </div>

      </div>

    </header>


    <!-- Main -->

    <main>

      <!-- Hero -->

      <section class="hero">

        <div>

          <h1>
            Rewards Store
          </h1>

          <p>
            Choose something you've earned.
          </p>

        </div>

        <button
          class="history-button"
          onclick="showHistory()"
        >
          Redemption History
        </button>

      </section>


      <!-- Categories -->

      <nav
        class="filters"
        id="filters"
      ></nav>


      <!-- Products -->

      <section
        class="grid"
        id="productGrid"
      ></section>

    </main>

  </div>


  <!-- =========================
       Redeem Modal
  ========================= -->

  <div
    class="overlay"
    id="overlay"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Redeem reward?
      </h2>

      <p
        class="modal-description"
        id="modalDescription"
      ></p>

      <div
        class="balance-box"
        id="modalBalance"
      ></div>

      <div class="modal-buttons">

        <button onclick="closeModal()">
          Cancel
        </button>

        <button
          class="confirm"
          onclick="confirmRedeem()"
        >
          Redeem
        </button>

      </div>

    </div>

  </div>


  <!-- Toast -->

  <div
    class="toast"
    id="toast"
  ></div>


<script>

/* =====================================================
   DATA
===================================================== */

const rewards = [

  {
    id: 1,
    name: "Movie Night",
    cost: 500,
    category: "Entertainment",
    icon: "🎬"
  },

  {
    id: 2,
    name: "Ice Cream",
    cost: 300,
    category: "Food",
    icon: "🍦"
  },

  {
    id: 3,
    name: "Choose Dinner",
    cost: 800,
    category: "Privileges",
    icon: "🍽️"
  },

  {
    id: 4,
    name: "Toy of Choice",
    cost: 1200,
    category: "Toys",
    icon: "🧸"
  },

  {
    id: 5,
    name: "Extra Screen Time",
    cost: 400,
    category: "Privileges",
    icon: "📱"
  },

  {
    id: 6,
    name: "Pizza Night",
    cost: 700,
    category: "Food",
    icon: "🍕"
  },

  {
    id: 7,
    name: "Board Game",
    cost: 1000,
    category: "Toys",
    icon: "🎲"
  },

  {
    id: 8,
    name: "Family Outing",
    cost: 1500,
    category: "Entertainment",
    icon: "🎡"
  },

  {
    id: 9,
    name: "Favorite Dessert",
    cost: 350,
    category: "Food",
    icon: "🍰"
  },

  {
    id: 10,
    name: "Skip One Chore",
    cost: 600,
    category: "Privileges",
    icon: "✨"
  },

  {
    id: 11,
    name: "New Book",
    cost: 900,
    category: "Other",
    icon: "📚"
  },

  {
    id: 12,
    name: "$5 Treat",
    cost: 500,
    category: "Other",
    icon: "🎁"
  },

  {
    id: 13,
    name: "Game Night",
    cost: 650,
    category: "Entertainment",
    icon: "🎮"
  },

  {
    id: 14,
    name: "Small Toy",
    cost: 700,
    category: "Toys",
    icon: "🚗"
  },

  {
    id: 15,
    name: "Breakfast Choice",
    cost: 450,
    category: "Food",
    icon: "🥞"
  }

];


/* =====================================================
   STATE
===================================================== */

let balance = 2450;

let selectedReward = null;

let activeCategory = "All";

let redemptionHistory = [];


/* =====================================================
   CATEGORIES
===================================================== */

const categories = [
  "All",
  ...new Set(
    rewards.map(
      reward => reward.category
    )
  )
];


/* =====================================================
   RENDER FILTERS
===================================================== */

function renderFilters() {

  const container =
    document.getElementById("filters");

  container.innerHTML =
    categories
      .map(category => {

        return `
          <button
            class="filter ${
              category === activeCategory
                ? "active"
                : ""
            }"
            onclick="setCategory('${category}')"
          >
            ${category}
          </button>
        `;

      })
      .join("");

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

  const grid =
    document.getElementById("productGrid");

  let visibleRewards;

  if (activeCategory === "All") {

    visibleRewards = rewards;

  } else {

    visibleRewards =
      rewards.filter(
        reward =>
          reward.category ===
          activeCategory
      );

  }


  grid.innerHTML =
    visibleRewards
      .map(reward => {

        const canRedeem =
          balance >= reward.cost;

        return `

          <article class="card">

            <div class="product-image">
              ${reward.icon}
            </div>

            <div class="product-content">

              <div class="product-name">
                ${reward.name}
              </div>

              <div class="product-cost">
                ${reward.cost.toLocaleString()}
                points
              </div>

              <button
                class="redeem-button"
                ${
                  canRedeem
                    ? ""
                    : "disabled"
                }
                onclick="openRedeem(${reward.id})"
              >
                ${
                  canRedeem
                    ? "Redeem"
                    : "Not enough points"
                }
              </button>

            </div>

          </article>

        `;

      })
      .join("");

}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category) {

  activeCategory = category;

  renderFilters();

  renderProducts();

}


/* =====================================================
   OPEN REDEEM MODAL
===================================================== */

function openRedeem(id) {

  selectedReward =
    rewards.find(
      reward => reward.id === id
    );

  if (!selectedReward) {
    return;
  }


  document.getElementById(
    "modalTitle"
  ).textContent =
    `Redeem ${selectedReward.name}?`;


  document.getElementById(
    "modalDescription"
  ).textContent =
    `This reward costs ${
      selectedReward.cost.toLocaleString()
    } points.`;


  const afterBalance =
    balance -
    selectedReward.cost;


  document.getElementById(
    "modalBalance"
  ).innerHTML = `

    Current balance:
    <strong>
      ${balance.toLocaleString()} pts
    </strong>

    <br>

    After redemption:
    <strong>
      ${afterBalance.toLocaleString()} pts
    </strong>

  `;


  document.getElementById(
    "overlay"
  ).style.display = "flex";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

  document.getElementById(
    "overlay"
  ).style.display = "none";

  selectedReward = null;

}


/* =====================================================
   CONFIRM REDEEM
===================================================== */

function confirmRedeem() {

  if (!selectedReward) {
    return;
  }


  if (
    balance <
    selectedReward.cost
  ) {

    closeModal();

    showToast(
      "Not enough points."
    );

    return;

  }


  balance -=
    selectedReward.cost;


  /*
    Add redemption record
  */

  redemptionHistory.push({

    reward:
      selectedReward.name,

    cost:
      selectedReward.cost,

    date:
      new Date().toLocaleDateString()

  });


  /*
    Update balance
  */

  document.getElementById(
    "points"
  ).textContent =
    balance.toLocaleString();


  const rewardName =
    selectedReward.name;


  closeModal();


  renderProducts();


  showToast(
    `${rewardName} redeemed successfully`
  );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  }, 2400);

}


/* =====================================================
   HISTORY
===================================================== */

function showHistory() {

  if (
    redemptionHistory.length === 0
  ) {

    showToast(
      "No redemption history yet."
    );

    return;

  }


  const latest =
    redemptionHistory
      .map(
        item =>
          `${item.reward} (-${item.cost} pts)`
      )
      .join(" • ");


  showToast(latest);

}


/* =====================================================
   INITIALIZE
===================================================== */

renderFilters();

renderProducts();

</script>
<script src="js/app.js"></script>

</body>
</html>
