<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Rewards</title>
<link
    rel="stylesheet"
    href="css/style.css"
  >
</head>
  

<body>

  <!-- =========================
       APP
  ========================= -->

  <div id="app">

    <!-- Header -->

    <header>

      <div class="brand">
        Family Rewards
      </div>

      <div class="account">

        <div class="user-info">

          <div class="user-name">
            Alex
          </div>

          <div class="points">
            <strong id="points">
              2,450
            </strong>
            points
          </div>

        </div>

        <div class="avatar">
          A
        </div>

      </div>

    </header>


    <!-- Main -->

    <main>

      <!-- Hero -->

      <section class="hero">

        <div>

          <h1>
            Rewards Store
          </h1>

          <p>
            Choose something you've earned.
          </p>

        </div>

        <button
          class="history-button"
          onclick="showHistory()"
        >
          Redemption History
        </button>

      </section>


      <!-- Categories -->

      <nav
        class="filters"
        id="filters"
      ></nav>


      <!-- Products -->

      <section
        class="grid"
        id="productGrid"
      ></section>

    </main>

  </div>


  <!-- =========================
       Redeem Modal
  ========================= -->

  <div
    class="overlay"
    id="overlay"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Redeem reward?
      </h2>

      <p
        class="modal-description"
        id="modalDescription"
      ></p>

      <div
        class="balance-box"
        id="modalBalance"
      ></div>

      <div class="modal-buttons">

        <button onclick="closeModal()">
          Cancel
        </button>

        <button
          class="confirm"
          onclick="confirmRedeem()"
        >
          Redeem
        </button>

      </div>

    </div>

  </div>


  <!-- Toast -->

  <div
    class="toast"
    id="toast"
  ></div>



<script src="js/app.js"></script>

</body>
</html>
