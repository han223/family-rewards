<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Family Rewards</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

</head>


<body>

  <!-- =========================
       APP
  ========================= -->

  <div id="app">


    <!-- =========================
         HEADER
    ========================= -->

    <header>

      <div class="brand">
        Family Rewards
      </div>


      <div class="account">

        <div class="user-info">

          <div class="user-name">
            Alex
          </div>

          <div class="points">

            <strong id="points">
              2,450
            </strong>

            points

          </div>

        </div>


        <div class="avatar">
          A
        </div>

      </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


      <!-- HERO -->

      <section class="hero">

        <div>

          <h1>
            Rewards Store
          </h1>

          <p>
            Choose something you've earned.
          </p>

        </div>


        <button
          class="history-button"
          onclick="showHistory()"
        >
          Redemption History
        </button>

      </section>



      <!-- CATEGORIES -->

      <nav
        class="filters"
        id="filters"
      ></nav>



      <!-- PRODUCTS -->

      <section
        class="grid"
        id="productGrid"
      ></section>


    </main>

  </div>



  <!-- =========================
       REDEEM MODAL
  ========================= -->

  <div
    class="overlay"
    id="overlay"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Redeem reward?
      </h2>


      <p
        class="modal-description"
        id="modalDescription"
      ></p>


      <div
        class="balance-box"
        id="modalBalance"
      ></div>


      <div class="modal-buttons">

        <button
          onclick="closeModal()"
        >
          Cancel
        </button>


        <button
          class="confirm"
          onclick="confirmRedeem()"
        >
          Redeem
        </button>

      </div>

    </div>

  </div>



  <!-- =========================
       EDIT REWARD MODAL
  ========================= -->

  <div
    class="overlay"
    id="editOverlay"
  >

    <div class="edit-modal">

      <div class="edit-modal-header">

        <div>

          <h2>
            Edit Reward
          </h2>

          <p>
            Update this reward's information.
          </p>

        </div>


        <button
          class="close-edit-button"
          onclick="closeEditReward()"
          aria-label="Close"
        >
          ×
        </button>

      </div>



      <!-- NAME -->

      <div class="edit-field">

        <label for="editRewardName">
          Reward name
        </label>

        <input
          id="editRewardName"
          type="text"
          placeholder="Reward name"
        />

      </div>



      <!-- POINTS -->

      <div class="edit-field">

        <label for="editRewardCost">
          Points required
        </label>

        <input
          id="editRewardCost"
          type="number"
          min="0"
          step="1"
          placeholder="Points"
        />

      </div>



      <!-- PHOTO -->

      <div class="edit-field">

        <label>
          Reward photo
        </label>


        <div
          class="edit-photo-area"
          id="editPhotoArea"
        >

          <div
            class="edit-photo-preview"
            id="editPhotoPreview"
          >
          </div>

        </div>


        <div class="photo-actions">

          <button
            class="secondary-button"
            onclick="chooseRewardPhoto()"
          >
            📷 Change photo
          </button>


          <button
            class="secondary-button danger-button"
            onclick="removeRewardPhoto()"
          >
            Remove photo
          </button>

        </div>


        <input
          type="file"
          id="rewardPhotoInput"
          accept="image/*"
          hidden
        />

      </div>



      <!-- BUTTONS -->

      <div class="edit-modal-buttons">

        <button
          class="cancel-edit-button"
          onclick="closeEditReward()"
        >
          Cancel
        </button>


        <button
          class="save-edit-button"
          onclick="saveEditedReward()"
        >
          Save changes
        </button>

      </div>

    </div>

  </div>



  <!-- =========================
       TOAST
  ========================= -->

  <div
    class="toast"
    id="toast"
  ></div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <!-- Supabase JavaScript SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Family Rewards App -->
  <script src="js/app.js"></script>

</body>

</html>
