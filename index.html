<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Rewards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f5;
      color: #171717;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* =========================
       Header
    ========================= */

    header {
      height: 76px;
      background: #ffffff;
      border-bottom: 1px solid #e8e8e5;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 42px;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 650;
    }

    .points {
      margin-top: 2px;
      color: #777;
      font-size: 13px;
    }

    .points strong {
      color: #171717;
    }

    .avatar {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: #eeeeeb;

      display: grid;
      place-items: center;

      font-size: 14px;
      font-weight: 700;
    }

    /* =========================
       Main
    ========================= */

    main {
      max-width: 1500px;
      margin: 0 auto;

      padding: 36px 42px 60px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;

      margin-bottom: 28px;
    }

    .hero h1 {
      margin: 0;

      font-size: 38px;
      letter-spacing: -1.5px;
    }

    .hero p {
      margin: 8px 0 0;

      color: #777;
      font-size: 15px;
    }

    .history-button {
      background: #ffffff;

      border: 1px solid #dededb;
      border-radius: 10px;

      padding: 11px 16px;

      color: #333;
    }

    .history-button:hover {
      background: #f4f4f2;
    }

    /* =========================
       Categories
    ========================= */

    .filters {
      display: flex;
      gap: 8px;

      margin-bottom: 25px;

      overflow-x: auto;
    }

    .filter {
      border: 0;
      background: transparent;

      padding: 9px 15px;

      border-radius: 9px;

      color: #666;
      white-space: nowrap;
    }

    .filter:hover {
      background: #eeeeeb;
    }

    .filter.active {
      background: #171717;
      color: #ffffff;
    }

    /* =========================
       Product Grid
    ========================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 18px;
    }

    .card {
      background: #ffffff;

      border: 1px solid #e9e9e6;
      border-radius: 15px;

      overflow: hidden;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .product-image {
      height: 205px;

      background: #f1f1ee;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 58px;
    }

    .product-content {
      padding: 15px;
    }

    .product-name {
      font-size: 16px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .product-cost {
      font-size: 13px;
      color: #777;

      margin-bottom: 14px;
    }

    .redeem-button {
      width: 100%;

      border: 0;
      border-radius: 9px;

      padding: 10px;

      background: #171717;
      color: #ffffff;

      font-weight: 650;
    }

    .redeem-button:hover {
      background: #333333;
    }

    .redeem-button:disabled {
      background: #dededb;
      color: #999;

      cursor: not-allowed;
    }

    /* =========================
       Modal
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.35);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    .modal {
      width: min(430px, calc(100vw - 32px));

      background: #ffffff;

      border-radius: 18px;

      padding: 27px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin: 0 0 8px;

      font-size: 21px;
    }

    .modal-description {
      color: #666;

      line-height: 1.5;
    }

    .balance-box {
      background: #f6f6f3;

      padding: 14px;

      border-radius: 10px;

      margin: 18px 0;

      font-size: 14px;

      line-height: 1.7;
    }

    .modal-buttons {
      display: flex;
      gap: 9px;
    }

    .modal-buttons button {
      flex: 1;

      padding: 11px;

      border-radius: 9px;

      border: 1px solid #ddd;

      background: #fff;
    }

    .modal-buttons .confirm {
      background: #171717;
      color: white;

      border-color: #171717;
    }

    /* =========================
       Toast
    ========================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      background: #171717;
      color: #ffffff;

      padding: 12px 18px;

      border-radius: 10px;

      opacity: 0;

      pointer-events: none;

      transition: 0.2s;

      z-index: 30;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

      header {
        padding: 0 22px;
      }

      main {
        padding: 28px 22px 50px;
      }
    }

    @media (max-width: 650px) {
      header {
        height: 68px;
      }

      .user-info {
        display: none;
      }

      main {
        padding: 24px 15px 40px;
      }

      .hero {
        align-items: flex-start;

        flex-direction: column;

        gap: 18px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .product-image {
        height: 150px;

        font-size: 48px;
      }

      .product-content {
        padding: 12px;
      }

      .product-name {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       APP
  ========================= -->

  <div id="app">

    <!-- Header -->

    <header>

      <div class="brand">
        Family Rewards
      </div>

      <div class="account">

        <div class="user-info">

          <div class="user-name">
            Alex
          </div>

          <div class="points">
            <strong id="points">
              2,450
            </strong>
            points
          </div>

        </div>

        <div class="avatar">
          A
        </div>

      </div>

    </header>


    <!-- Main -->

    <main>

      <!-- Hero -->

      <section class="hero">

        <div>

          <h1>
            Rewards Store
          </h1>

          <p>
            Choose something you've earned.
          </p>

        </div>

        <button
          class="history-button"
          onclick="showHistory()"
        >
          Redemption History
        </button>

      </section>


      <!-- Categories -->

      <nav
        class="filters"
        id="filters"
      ></nav>


      <!-- Products -->

      <section
        class="grid"
        id="productGrid"
      ></section>

    </main>

  </div>


  <!-- =========================
       Redeem Modal
  ========================= -->

  <div
    class="overlay"
    id="overlay"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Redeem reward?
      </h2>

      <p
        class="modal-description"
        id="modalDescription"
      ></p>

      <div
        class="balance-box"
        id="modalBalance"
      ></div>

      <div class="modal-buttons">

        <button onclick="closeModal()">
          Cancel
        </button>

        <button
          class="confirm"
          onclick="confirmRedeem()"
        >
          Redeem
        </button>

      </div>

    </div>

  </div>


  <!-- Toast -->

  <div
    class="toast"
    id="toast"
  ></div>


<script>

/* =====================================================
   DATA
===================================================== */

const rewards = [

  {
    id: 1,
    name: "Movie Night",
    cost: 500,
    category: "Entertainment",
    icon: "🎬"
  },

  {
    id: 2,
    name: "Ice Cream",
    cost: 300,
    category: "Food",
    icon: "🍦"
  },

  {
    id: 3,
    name: "Choose Dinner",
    cost: 800,
    category: "Privileges",
    icon: "🍽️"
  },

  {
    id: 4,
    name: "Toy of Choice",
    cost: 1200,
    category: "Toys",
    icon: "🧸"
  },

  {
    id: 5,
    name: "Extra Screen Time",
    cost: 400,
    category: "Privileges",
    icon: "📱"
  },

  {
    id: 6,
    name: "Pizza Night",
    cost: 700,
    category: "Food",
    icon: "🍕"
  },

  {
    id: 7,
    name: "Board Game",
    cost: 1000,
    category: "Toys",
    icon: "🎲"
  },

  {
    id: 8,
    name: "Family Outing",
    cost: 1500,
    category: "Entertainment",
    icon: "🎡"
  },

  {
    id: 9,
    name: "Favorite Dessert",
    cost: 350,
    category: "Food",
    icon: "🍰"
  },

  {
    id: 10,
    name: "Skip One Chore",
    cost: 600,
    category: "Privileges",
    icon: "✨"
  },

  {
    id: 11,
    name: "New Book",
    cost: 900,
    category: "Other",
    icon: "📚"
  },

  {
    id: 12,
    name: "$5 Treat",
    cost: 500,
    category: "Other",
    icon: "🎁"
  },

  {
    id: 13,
    name: "Game Night",
    cost: 650,
    category: "Entertainment",
    icon: "🎮"
  },

  {
    id: 14,
    name: "Small Toy",
    cost: 700,
    category: "Toys",
    icon: "🚗"
  },

  {
    id: 15,
    name: "Breakfast Choice",
    cost: 450,
    category: "Food",
    icon: "🥞"
  }

];


/* =====================================================
   STATE
===================================================== */

let balance = 2450;

let selectedReward = null;

let activeCategory = "All";

let redemptionHistory = [];


/* =====================================================
   CATEGORIES
===================================================== */

const categories = [
  "All",
  ...new Set(
    rewards.map(
      reward => reward.category
    )
  )
];


/* =====================================================
   RENDER FILTERS
===================================================== */

function renderFilters() {

  const container =
    document.getElementById("filters");

  container.innerHTML =
    categories
      .map(category => {

        return `
          <button
            class="filter ${
              category === activeCategory
                ? "active"
                : ""
            }"
            onclick="setCategory('${category}')"
          >
            ${category}
          </button>
        `;

      })
      .join("");

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

  const grid =
    document.getElementById("productGrid");

  let visibleRewards;

  if (activeCategory === "All") {

    visibleRewards = rewards;

  } else {

    visibleRewards =
      rewards.filter(
        reward =>
          reward.category ===
          activeCategory
      );

  }


  grid.innerHTML =
    visibleRewards
      .map(reward => {

        const canRedeem =
          balance >= reward.cost;

        return `

          <article class="card">

            <div class="product-image">
              ${reward.icon}
            </div>

            <div class="product-content">

              <div class="product-name">
                ${reward.name}
              </div>

              <div class="product-cost">
                ${reward.cost.toLocaleString()}
                points
              </div>

              <button
                class="redeem-button"
                ${
                  canRedeem
                    ? ""
                    : "disabled"
                }
                onclick="openRedeem(${reward.id})"
              >
                ${
                  canRedeem
                    ? "Redeem"
                    : "Not enough points"
                }
              </button>

            </div>

          </article>

        `;

      })
      .join("");

}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category) {

  activeCategory = category;

  renderFilters();

  renderProducts();

}


/* =====================================================
   OPEN REDEEM MODAL
===================================================== */

function openRedeem(id) {

  selectedReward =
    rewards.find(
      reward => reward.id === id
    );

  if (!selectedReward) {
    return;
  }


  document.getElementById(
    "modalTitle"
  ).textContent =
    `Redeem ${selectedReward.name}?`;


  document.getElementById(
    "modalDescription"
  ).textContent =
    `This reward costs ${
      selectedReward.cost.toLocaleString()
    } points.`;


  const afterBalance =
    balance -
    selectedReward.cost;


  document.getElementById(
    "modalBalance"
  ).innerHTML = `

    Current balance:
    <strong>
      ${balance.toLocaleString()} pts
    </strong>

    <br>

    After redemption:
    <strong>
      ${afterBalance.toLocaleString()} pts
    </strong>

  `;


  document.getElementById(
    "overlay"
  ).style.display = "flex";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

  document.getElementById(
    "overlay"
  ).style.display = "none";

  selectedReward = null;

}


/* =====================================================
   CONFIRM REDEEM
===================================================== */

function confirmRedeem() {

  if (!selectedReward) {
    return;
  }


  if (
    balance <
    selectedReward.cost
  ) {

    closeModal();

    showToast(
      "Not enough points."
    );

    return;

  }


  balance -=
    selectedReward.cost;


  /*
    Add redemption record
  */

  redemptionHistory.push({

    reward:
      selectedReward.name,

    cost:
      selectedReward.cost,

    date:
      new Date().toLocaleDateString()

  });


  /*
    Update balance
  */

  document.getElementById(
    "points"
  ).textContent =
    balance.toLocaleString();


  const rewardName =
    selectedReward.name;


  closeModal();


  renderProducts();


  showToast(
    `${rewardName} redeemed successfully`
  );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  }, 2400);

}


/* =====================================================
   HISTORY
===================================================== */

function showHistory() {

  if (
    redemptionHistory.length === 0
  ) {

    showToast(
      "No redemption history yet."
    );

    return;

  }


  const latest =
    redemptionHistory
      .map(
        item =>
          `${item.reward} (-${item.cost} pts)`
      )
      .join(" • ");


  showToast(latest);

}


/* =====================================================
   INITIALIZE
===================================================== */

renderFilters();

renderProducts();

</script>

</body>
</html>
